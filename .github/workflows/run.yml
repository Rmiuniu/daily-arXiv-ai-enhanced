name: arXiv-daily-ai-enhanced

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      LANGUAGE: ${{ vars.LANGUAGE || 'Chinese' }}
      CATEGORIES: ${{ vars.CATEGORIES }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      GIT_NAME: ${{ vars.NAME || 'github-actions[bot]' }}
      GIT_EMAIL: ${{ vars.EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync
          test -x .venv/bin/scrapy || { echo "::error::.venv 中没有 scrapy，依赖未安装成功"; exit 1; }
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Crawl arXiv papers
        id: crawl_step
        timeout-minutes: 30
        run: |
          set -euo pipefail
          today=$(date -u "+%Y-%m-%d")
          echo "TODAY=${today}" >> "$GITHUB_ENV"
          echo "crawl_date=${today}" >> "$GITHUB_OUTPUT"
          echo "开始爬取 ${today} 的 arXiv 论文..."

          mkdir -p data
          if [ -f "data/${today}.jsonl" ]; then
            rm -f "data/${today}.jsonl"
            echo "已删除已有文件 data/${today}.jsonl，重新生成"
          else
            echo "今日文件不存在，准备新建"
          fi

          cd daily_arxiv
          scrapy crawl arxiv -o "../data/${today}.jsonl"

          if [ ! -s "../data/${today}.jsonl" ]; then
            echo "::error::爬取失败，未生成数据文件 data/${today}.jsonl"
            exit 1
          fi

          lines=$(wc -l < "../data/${today}.jsonl")
          echo "爬取完成，共 ${lines} 行"

      - name: Check for duplicates
        id: dedup_check
        run: |
          set -euo pipefail
          echo "执行去重检查..."

          cd daily_arxiv
          set +e
          python daily_arxiv/check_stats.py
          dedup_exit_code=$?
          set -e

          echo "去重检查退出码: ${dedup_exit_code}"
          echo "dedup_exit_code=${dedup_exit_code}" >> "$GITHUB_OUTPUT"

          case "${dedup_exit_code}" in
            0)
              echo "has_new_content=true" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "has_new_content=false" >> "$GITHUB_OUTPUT"
              echo "skip_reason=no_new_content" >> "$GITHUB_OUTPUT"
              echo "去重后无新内容，跳过后续处理"
              ;;
            2)
              echo "has_new_content=false" >> "$GITHUB_OUTPUT"
              echo "skip_reason=processing_error" >> "$GITHUB_OUTPUT"
              echo "::error::去重处理出错"
              exit 1
              ;;
            *)
              echo "has_new_content=false" >> "$GITHUB_OUTPUT"
              echo "skip_reason=unknown_error" >> "$GITHUB_OUTPUT"
              echo "::error::未知退出码 ${dedup_exit_code}"
              exit 1
              ;;
          esac

      - name: AI Enhancement Processing
        if: ${{ steps.dedup_check.outputs.has_new_content == 'true' }}
        timeout-minutes: 45
        run: |
          set -euo pipefail
          echo "开始 AI 增强处理..."
          cd ai

          for i in 1 2; do
            echo "AI 处理第 ${i} 次尝试"
            if python enhance.py --data "../data/${TODAY}.jsonl"; then
              echo "AI 增强处理完成"
              exit 0
            fi
            echo "::warning::AI 处理第 ${i} 次失败（该脚本失败时不落盘，重试会整批重新计费）"
            if [ "${i}" -lt 2 ]; then
              sleep 120
            fi
          done

          echo "::error::AI 处理失败，未生成结果文件"
          exit 1

      - name: Convert to Markdown
        if: ${{ steps.dedup_check.outputs.has_new_content == 'true' }}
        run: |
          set -euo pipefail
          echo "转换为 Markdown 格式..."
          cd to_md

          AI_FILE="../data/${TODAY}_AI_enhanced_${LANGUAGE}.jsonl"
          if [ ! -f "${AI_FILE}" ]; then
            echo "::error::未找到 AI 增强文件 ${AI_FILE}"
            exit 1
          fi

          python convert.py --data "${AI_FILE}"
          echo "Markdown 转换完成"

      - name: Update file list
        if: ${{ steps.dedup_check.outputs.has_new_content == 'true' }}
        run: |
          set -euo pipefail
          ls data/*.jsonl 2>/dev/null | sed 's|data/||' > assets/file-list.txt || true
          count=$(wc -l < assets/file-list.txt || echo 0)
          echo "文件列表更新完成，共 ${count} 个文件"

      - name: Generate password hash and inject into config
        if: ${{ steps.dedup_check.outputs.has_new_content == 'true' }}
        env:
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ACCESS_PASSWORD:-}" ]; then
            PASSWORD_HASH="DISABLED_NO_PASSWORD_SET_IN_SECRETS"
            echo "::warning::ACCESS_PASSWORD 未设置，密码保护关闭"
          else
            PASSWORD_HASH=$(printf '%s' "${ACCESS_PASSWORD}" | openssl dgst -sha256 -hex | awk '{print $2}')
            echo "密码保护已启用"
          fi

          if [ ! -f "js/auth-config.js" ]; then
            echo "::error::js/auth-config.js 不存在"
            exit 1
          fi

          sed -i -E "s/passwordHash: *'[^']*'/passwordHash: '${PASSWORD_HASH}'/" js/auth-config.js

          if ! grep -q "passwordHash: '${PASSWORD_HASH}'" js/auth-config.js; then
            echo "::error::密码注入失败"
            exit 1
          fi

          echo "密码配置已写入 js/auth-config.js"

      - name: Inject repository info into data-config.js
        if: ${{ steps.dedup_check.outputs.has_new_content == 'true' }}
        run: |
          set -euo pipefail
          echo "注入仓库信息到 data-config.js..."

          if [ ! -f "js/data-config.js" ]; then
            echo "::error::js/data-config.js 不存在"
            exit 1
          fi

          OWNER="${{ github.repository_owner }}"
          NAME="${{ github.event.repository.name }}"
          sed -i -E "s/repoOwner: *'[^']*'/repoOwner: '${OWNER}'/" js/data-config.js
          sed -i -E "s/repoName: *'[^']*'/repoName: '${NAME}'/" js/data-config.js

          if ! grep -q "repoOwner: '${OWNER}'" js/data-config.js; then
            echo "::error::仓库信息注入失败"
            exit 1
          fi

          echo "仓库信息已注入（${OWNER}/${NAME}）"

      - name: Commit code changes to main branch
        if: ${{ steps.dedup_check.outputs.has_new_content == 'true' }}
        run: |
          set -euo pipefail
          git config user.email "${GIT_EMAIL}"
          git config user.name "${GIT_NAME}"

          git add -A
          git reset -q -- data/ assets/file-list.txt || true

          if git diff --staged --quiet; then
            echo "没有代码变更需要提交"
          else
            git commit -m "chore: update config with repository info"
            echo "代码变更已提交到 main"
          fi

      - name: Push code changes to main branch
        if: ${{ steps.dedup_check.outputs.has_new_content == 'true' }}
        run: |
          set -euo pipefail
          git config pull.rebase true
          git config rebase.autoStash true

          for i in 1 2 3; do
            echo "推送 main 第 ${i} 次尝试"
            if git push origin main; then
              echo "main 推送成功"
              break
            fi
            echo "推送失败，拉取最新变更"
            git pull --rebase origin main || true
            if [ "${i}" -eq 3 ]; then
              echo "::error::3 次尝试后仍无法推送 main"
              exit 1
            fi
          done

      - name: Prepare data files for data branch
        if: ${{ steps.dedup_check.outputs.has_new_content == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/data_files/data /tmp/data_files/assets
          cp -r data/* /tmp/data_files/data/ 2>/dev/null || true
          cp assets/file-list.txt /tmp/data_files/assets/ 2>/dev/null || true
          echo "数据文件已暂存到 /tmp/data_files"

      - name: Setup and commit to data branch
        if: ${{ steps.dedup_check.outputs.has_new_content == 'true' }}
        run: |
          set -euo pipefail
          git config user.email "${GIT_EMAIL}"
          git config user.name "${GIT_NAME}"

          rm -rf data/*.jsonl data/*.md assets/file-list.txt 2>/dev/null || true

          if git ls-remote --heads origin data | grep -q 'refs/heads/data$'; then
            echo "data 分支已存在，切换到 data 分支"
            git fetch origin data:data --force
            git checkout -f data
            git reset --hard origin/data
          else
            echo "data 分支不存在，创建新分支"
            git checkout --orphan data
            git rm -rf --cached . > /dev/null 2>&1 || true
            mkdir -p data assets
            echo "# Data Branch" > README.md
            git add README.md
            git commit -m "chore: initialize data branch"
            git push origin data
          fi

          mkdir -p data assets
          cp -r /tmp/data_files/data/* data/ 2>/dev/null || true
          cp /tmp/data_files/assets/file-list.txt assets/ 2>/dev/null || true

          git add -A data assets
          if git diff --staged --quiet; then
            echo "没有数据变更需要提交"
          else
            git commit -m "update: ${TODAY} arXiv papers"
            echo "数据变更已提交到 data 分支"
          fi

      - name: Push data changes to data branch
        if: ${{ steps.dedup_check.outputs.has_new_content == 'true' }}
        run: |
          set -euo pipefail
          git config pull.rebase true
          git config rebase.autoStash true

          for i in 1 2 3; do
            echo "推送 data 第 ${i} 次尝试"
            if git push origin data; then
              echo "data 推送成功"
              break
            fi
            echo "推送失败，拉取最新变更"
            git pull --rebase origin data || true
            if [ "${i}" -eq 3 ]; then
              echo "::error::3 次尝试后仍无法推送 data"
              exit 1
            fi
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## arXiv 日报运行摘要"
            echo ""
            echo "- 运行日期: ${TODAY:-未取到}"
            echo "- 触发方式: ${{ github.event_name }}"
            echo "- 有新内容: ${{ steps.dedup_check.outputs.has_new_content }}"
            echo "- 跳过原因: ${{ steps.dedup_check.outputs.skip_reason }}"
            echo "- 任务状态: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: failure()
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${SCT_KEY:-}" ]; then
            echo "未配置 SCT_KEY，跳过通知"
            exit 0
          fi
          curl -fsS "https://sctapi.ftqq.com/${SCT_KEY}.send" \
            --data-urlencode "title=arXiv 定时任务失败" \
            --data-urlencode "desp=查看日志: ${RUN_URL}" || true
